name: Tests

# The repo only had a publish workflow, so nothing ever ran the test suite -
# which is how a JS syntax error in the main stealth bypass, a crashing rate
# limiter and silent crawler data loss all shipped to PyPI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (for JS bypass syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-mock pytest-timeout ruff

      - name: Verify every JS bypass parses
        run: |
          for f in chuscraper/engine/bypasses/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Lint for real errors (undefined names, bad syntax)
        run: ruff check chuscraper/ --select F821,F841,E9

      - name: Run tests
        # Browser-backed tests are opt-in (CHUSCRAPER_BROWSER_TESTS=1) because
        # they launch real Chrome and hit the network. --timeout makes a hang
        # fail the job instead of burning the runner's whole budget.
        run: pytest tests/core -q --timeout=120
